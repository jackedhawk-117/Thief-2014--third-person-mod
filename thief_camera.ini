; Thief (2014) Third-Person Camera Configuration
[Camera]
; Toggle 1st / 3rd person perspective
; 0x73 = VK_F4 (115), 0x72 = VK_F3 (114), 0x75 = VK_F6 (117)
ToggleKey=0x73

; Default camera distance behind Garrett (in Unreal units)
Distance=180.0

; Vertical camera height offset (in Unreal units)
HeightOffset=25.0

; Shoulder offset: positive = right shoulder, negative = left shoulder, 0.0 = center
ShoulderOffset=30.0

; Camera position smoothing factor (0.0 = frozen, 1.0 = instant, 0.25 = recommended)
SmoothFactor=0.25
